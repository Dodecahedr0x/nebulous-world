envVarGroups:
  # Shared by nebulous-world (the app) and nebulous-world-indexer below —
  # a single source of truth instead of two copies of each value that could
  # silently drift apart. NEXT_PUBLIC_VOTE_TOKEN_MINT in particular MUST be
  # identical on both: it's what src/api.rs (indexer) derives
  # `user_token_account` ATAs against when building vote/stake/claim
  # transactions, and what the app uses to decide whether it's in
  # on-chain or simulation mode.
  - name: solana-shared-config
    envVars:
      # The app only uses this to tell the connected wallet extension which
      # chain it's operating on (see SolanaProvider.tsx) — it has no RPC
      # connection of its own, every on-chain read/write goes through the
      # indexer instead. The indexer uses it as its actual Solana RPC
      # endpoint.
      - key: NEXT_PUBLIC_SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: NEXT_PUBLIC_SOLANA_CLUSTER
        value: devnet
      - key: NEXT_PUBLIC_NEBULOUS_WORLD_PROGRAM_ID
        value: EkQRRgRFd2FUedJnPVs2Xs6N7U2Jef5GrfwJ62UJZUXx
      # Decimals of the vote/stake SPL mint. Both sides already default to
      # 6 on their own if this is unset (config.ts on the app, config.rs on
      # the indexer) — setting it once here just makes that shared default
      # explicit instead of two separate hardcoded fallbacks.
      - key: NEXT_PUBLIC_VOTE_TOKEN_DECIMALS
        value: "6"
      # Leave unset to run in off-chain "simulation" mode. Fill in once a
      # real SPL vote-token mint exists for this deploy — being a group
      # value, setting it here is enough to update both services at once.
      - key: NEXT_PUBLIC_VOTE_TOKEN_MINT
        sync: false

  # Shared by nebulous-world (the app) and nebulous-world-daily-snapshot
  # (the cron job) below — both only ever reach nebulous-world-indexer over
  # Render's internal network (it's a private service, no public HTTP
  # surface). See indexer/README.md and src/lib/indexerClient.ts.
  - name: indexer-internal-url
    envVars:
      - key: INDEXER_API_URL
        value: http://nebulous-world-indexer:8090

services:
  - type: web
    name: nebulous-world
    runtime: node
    repo: https://github.com/Dodecahedr0x/appmap
    rootDir: app
    # Must be a paid plan: nebulous-world-indexer below is a private
    # service, and Render's private networking (the http://nebulous-world-
    # indexer:8090 URL in INDEXER_API_URL) isn't available to Free-tier
    # instances, so a Free app can never reach it.
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    # This app has no Postgres connection at all any more — the indexer
    # (below) owns the database, applies its own schema, and is the only
    # thing that ever queries it (see root AGENTS.md and
    # src/lib/indexerClient.ts). No `prisma db push`/`migrate`/`generate`
    # in this build — there is no Prisma dependency left in app/.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # --- Solana & indexer (see envVarGroups at the top of this file) ---
      - fromGroup: solana-shared-config
      - fromGroup: indexer-internal-url

      # Treasury / program addresses (filled once the Anchor program is
      # deployed). Doubles as the x402 `payTo` address for the priced
      # /api/data/* endpoints (see src/lib/x402.ts) — those stay in
      # free/simulated mode (no 402ing) until this and
      # NEXT_PUBLIC_VOTE_TOKEN_MINT above are both set.
      - key: NEXT_PUBLIC_TREASURY_ADDRESS
        sync: false

      # --- App config ---
      - key: TRACKING_SECRET
        generateValue: true

      # Google AdSense site tag (Auto ads) — see
      # src/components/ads/AdSenseScript.tsx and .env.example's comment.
      # Not secret (it's emitted into every page's HTML regardless), so this
      # is set directly rather than sync: false.
      - key: NEXT_PUBLIC_ADSENSE_PUBLISHER_ID
        value: ca-pub-3646035530294447

      # --- Cloudflare Turnstile (leave unset to run without bot verification;
      # page views are then recorded as not revenue-eligible) ---
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # Statically-generated Mintlify docs site (see docs-site/README.md) —
  # explains the product concept and the x402 data API/pricing. A separate
  # static site, deliberately decoupled from the main app's own build/deploy
  # (nebulous-world above): a docs content change or a Mintlify CLI hiccup
  # should never be able to block or break the product's own deploy.
  # `NEXT_PUBLIC_DOCS_URL` on the main app defaults to this service's own
  # onrender.com URL (see app/src/lib/constants.ts) — override it there once
  # a custom docs domain is attached.
  - type: web
    name: nebulous-world-docs
    runtime: static
    repo: https://github.com/Dodecahedr0x/appmap
    rootDir: docs-site
    branch: main
    autoDeploy: true
    buildCommand: npx mintlify@latest export --output docs-export.zip --telemetry false && unzip -o docs-export.zip -d dist && rm docs-export.zip
    staticPublishPath: dist
    envVars:
      # The Mintlify CLI refuses to run on Node 25+ — pin to the LTS line
      # it supports (see docs-site/README.md's Requirements section).
      - key: NODE_VERSION
        value: "22.12.0"

  # Writes the AppStatsSnapshot rows that power per-app trend charts (see
  # app/scripts/dailySnapshot.ts) by calling the indexer's HTTP API — no
  # direct database access, same as the web service above.
  - type: cron
    name: nebulous-world-daily-snapshot
    runtime: node
    repo: https://github.com/Dodecahedr0x/appmap
    rootDir: app
    plan: starter
    schedule: "0 0 * * *"
    buildCommand: npm ci
    startCommand: npm run snapshot:daily
    envVars:
      - fromGroup: indexer-internal-url

  # Carbon (https://github.com/sevenlabs-hq/carbon) indexer: watches every
  # account owned by the nebulous_world program and every instruction sent
  # to it, runs periodic processing tasks that turn that raw on-chain data
  # into visualization-ready rows, AND is nebulous-world's (the app
  # service above) only path to Solana RPC — it exposes an HTTP API
  # (src/api.rs) for account reads and transaction building/submission
  # (see indexer/README.md). Private — no public HTTP surface, only
  # reachable on Render's internal network, since nothing outside this
  # deployment (i.e. no browser) ever calls it directly.
  #
  # This service also OWNS the database schema (indexer/src/db.rs runs
  # `sqlx::migrate!()` against every file in indexer/migrations/, including
  # the product schema mirrored from app/prisma/schema.prisma) and is the
  # only writer of App/Tag/AppTag rows — the app service above never runs
  # `prisma db push`/`migrate` and has no seed script (see AGENTS.md). On a
  # brand-new database, the app service may serve briefly before this
  # service's first successful migration; nothing in the app's own read
  # paths creates tables, so this settles itself once the indexer comes up.
  - type: pserv
    name: nebulous-world-indexer
    runtime: docker
    repo: https://github.com/Dodecahedr0x/appmap
    # Repo root, not `indexer` — indexer/Cargo.toml is now a member of the
    # root Cargo workspace (see /Cargo.toml), so the build needs the root
    # manifest/lockfile plus every workspace member's source (indexer/
    # depends on both `programs/nebulous_world` and `indexer/decoder` via
    # workspace-relative path deps) — see indexer/Dockerfile's own COPY
    # steps, which are root-relative to match.
    dockerContext: .
    dockerfilePath: indexer/Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nebulous-world-db
          property: connectionString

      # --- Solana (see envVarGroups at the top of this file) ---
      - fromGroup: solana-shared-config

      # NEB/USDC Meteora DLMM pool address — created by
      # app/scripts/launch-neb/ at deployment time, forwarded to the
      # dlmm-bridge sidecar (see dlmm-bridge/README.md). Leave unset until
      # that script has been run.
      - key: NEXT_PUBLIC_NEB_DLMM_POOL
        sync: false
      # devnet's public RPC serves WS on the same host/port as HTTP — see
      # default_ws_url in indexer/src/config.rs — so this only needs
      # setting for providers that don't (e.g. a paid RPC on a different
      # WS port).
      - key: RPC_WS_URL
        sync: false
      - key: ROLLUP_INTERVAL_SECS
        value: "60"
      - key: CRAWLER_POLL_INTERVAL_SECS
        value: "15"
      - key: PLATFORM_METRICS_INTERVAL_SECS
        value: "3600"
      - key: INDEXER_API_PORT
        value: "8090"

databases:
  - name: nebulous-world-db
    databaseName: nebulous_world
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
